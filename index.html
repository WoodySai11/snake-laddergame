<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake and Ladder Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        
        <div class="image-section">
            <img src="SnakesAndLadderBoard.jpeg" alt="Snake and Ladder Board">
        </div>

        <div class="logic-section">
            <h1 class="title">Snake & Ladder</h1>
            
            <div class="status-board">
                <h2 id="turn-message">Player 1, your turn!</h2>
                <div id="action-message">Click Roll to start</div>
                
                <div class="scores">
                    <div class="player-card active-player" id="p1-card">
                        <h3>Player 1</h3>
                        <p class="position" id="p1-pos">0</p>
                    </div>
                    <div class="player-card" id="p2-card">
                        <h3>Player 2</h3>
                        <p class="position" id="p2-pos">0</p>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="roll-btn" class="btn primary" onclick="playTurn()">Roll Dice</button>
                <button id="reset-btn" class="btn secondary" onclick="resetGame()">Restart Game</button>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
